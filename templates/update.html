<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>To Do update</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <h2 class="mb-4">My To Do update </h2>

    <!-- ============================== -->
    <!--      UPDATE TASK FORM SECTION     -->
    <!-- ============================== -->
     
    <form method="POST" action="/update/{{task.sno}}">
        <div class="row g-3 align-items-end mb-4">

            <!-- Task Name -->
            <div class="col-md-5">
                <label for="task" class="form-label">Task</label>
                <input type="text" class="form-control" id="task" name="task" placeholder=" task " value="{{task.title}}">
            </div>

            <!-- Date -->
            <div class="col-md-3">
                <label for="date" class="form-label">Date</label>
                <input type="date" class="form-control" id="date" name="date" value="{{task.des}}" required>
            </div>

            <!-- Priority -->
            <div class="col-md-3">
                <label for="priority" class="form-label">Priority</label>
                <select class="form-select" id="priority" name="priority" required>
                    <option value="High">High</option>
                    <option value="Medium">Medium</option>
                    <option value="Low">Low</option>
                </select>
            </div>

            <!-- Add Button -->
            <div class="col-md-1">
                 <button type="submit" class="btn btn-success w-100">Save</button>
            </div>

        </div>
    </form>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
