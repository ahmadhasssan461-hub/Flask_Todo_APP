<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>To Do List</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <h2 class="mb-4">My To Do List</h2>

    <!-- ============================== -->
    <!--      ADD TASK FORM SECTION     -->
    <!-- ============================== -->
    <form method="POST" action="/add">
        <div class="row g-3 align-items-end mb-4">

            <!-- Task Name -->
            <div class="col-md-5">
                <label for="task" class="form-label">Task</label>
                <input type="text" class="form-control" id="task" name="task" placeholder="Enter task name" required>
            </div>

            <!-- Date -->
            <div class="col-md-3">
                <label for="date" class="form-label">Date</label>
                <input type="date" class="form-control" id="date" name="date" required>
            </div>

            <!-- Priority -->
            <div class="col-md-3">
                <label for="priority" class="form-label">Priority</label>
                <select class="form-select" id="priority" name="priority" required>
                    <option value="High">High</option>
                    <option value="Medium">Medium</option>
                    <option value="Low">Low</option>
                </select>
            </div>

            <!-- Add Button -->
            <div class="col-md-1">
                <button type="submit" class="btn btn-primary w-100">Add</button>
            </div>

        </div>
    </form>

    <!-- ============================== -->
    <!--          TASK TABLE            -->
    <!-- ============================== -->
    
   <table class="table table-bordered table-hover">
    <thead class="table-dark">
        <tr>
            <th>#</th>
            <th>Task</th>
            <th>Date</th>
            <th>Priority</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody>
        {% for task in tasks %}
        <tr>
            <td>{{ loop.index }}</td>
            <td>{{ task.title }}</td>
            <td>{{ task.des }}</td>
            <td>{{ task.priority }}</td>
            <td>
                <div class="d-grid gap-2 d-md-flex justify-content-md-end"></div>
                <a href="/delete/{{ task.sno }}" class="btn btn-danger btn-sm">Delete</a>
                <a href="/update/{{ task.sno }}" class="btn btn-outline-info btn-sm">update</a>
            </td>
            
        </tr>
        {% endfor %}
    </tbody>
</table>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
